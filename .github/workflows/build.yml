name: Build TWA APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure & Build TWA
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\npassword123\npassword123\n' | bubblewrap init --manifest=https://glistening-kataifi-3da232.netlify.app/manifest.webmanifest
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandmasterChess-APK
          path: ./*.apk


